<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiny Pet</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <h1>🐾 Tiny Pet</h1>

    <div id="pet">
        <div id="pet-name">Bean</div>
        <input id="pet-name-input" style="display:none;" />
        <div id="pet-face">😊</div>

        <div id="pet-mood" class="text-line">Happy</div>
        <div id="pet-flavor-text" class="text-line">...</div>

        <div id="pet-bond-level"></div>

    </div>

    <div class="stat">
        Hunger
        <div class="bar"><div id="hunger-bar"></div></div>
    </div>

    <div class="stat">
        Happiness
        <div class="bar"><div id="happiness-bar"></div></div>
    </div>

    <div class="stat">
        Energy
        <div class="bar"><div id="energy-bar"></div></div>
    </div>
    <div class="text-line">Life Stage: <span id="pet-stage">🥚 Egg</span></div>
    <button id="feed-btn">🥭 Feed</button>
    <button id="play-btn">🧸 Play</button>
    <button id="sleep-btn">💤 Read a bedtime story</button>
    <div id="reset-link"><a onclick="resetPet()">Reset Pet</a></div>
    <div id="about-text" class="text-line">Tiny Pet v0.5 - A tiny prototype virtual pet. Stats update over time, even while you’re away.</div>
    <a href="../index.html" class="back-link">← Back to Tiny Games</a>
    <script src="script.js"></script>
</body>
</html>
